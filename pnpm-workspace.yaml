packages:
  - apps/*
  - packages/*
allowBuilds:
  lightningcss: true
  esbuild: true
  msw: true
  sharp: true
  '@parcel/watcher': true
  '@swc/core': true
  '@biomejs/biome': true
nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild
  - msw
#patchedDependencies:
#  mupdf: patches/mupdf.patch

catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  zod: ^4.4.3
  '@tailwindcss/vite': ^4.3.0
  tailwindcss: ^4.3.0
  '@types/node': ^22.10.2
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  typescript: ^6.0.3
  'lucide-react': ^1.16.0
  '@biomejs/biome': 2.4.15

overrides:
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
