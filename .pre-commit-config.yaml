repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      - id: encrypt-env
        name: Encrypt .env to secrets.env
        entry: bash -c 'if [ -f .env ]; then hash=$(sha256sum .env 2>/dev/null || shasum -a 256 .env | cut -d" " -f1); if [ ! -f .env.sha256 ] || [ "$(cat .env.sha256 2>/dev/null)" != "$hash" ]; then cp .env secrets.env && sops -e -i secrets.env && git add secrets.env && echo "$hash" > .env.sha256; fi; fi'
        language: system
        pass_filenames: false

      - id: forbid-env-files
        name: Prevent committing environment files
        entry: bash -c 'echo "Refusing to commit environment file(s):" >&2; printf "  - %s\n" "$@" >&2; echo "Commit a .env.example, .env.sample, or .env.template file instead." >&2; exit 1' --
        language: system
        files: '(^|/)\.env($|\.)'
        exclude: '(^|/)\.env.*\.(example|sample|template|sha256)$'

      - id: oxfmt
        name: Check formatting with oxfmt
        entry: bash -c 'pnpm exec oxfmt --check'
        language: system
        pass_filenames: false

      - id: oxlint
        name: Lint with oxlint
        entry: bash -c 'pnpm exec oxlint -c .oxlintrc.json --type-aware .'
        language: system
        pass_filenames: false

      - id: cargo-fmt
        name: Check Rust formatting
        entry: bash -c 'cargo fmt --check'
        language: system
        pass_filenames: false
