packages:
  - apps/*
  - packages/*
allowBuilds:
  lightningcss: true
  esbuild: true
  msw: true
  sharp: true
  "@parcel/watcher": true
  "@swc/core": true
nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild
  - msw
#patchedDependencies:
#  mupdf: patches/mupdf.patch

catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  zod: ^4.4.3
  "@tailwindcss/vite": ^4.3.3
  tailwindcss: ^4.3.3
  "@types/node": ^26.1.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  typescript: ^7.0.2
  "lucide-react": ^1.27.0
  oxlint: ^1.75.0
  oxfmt: ^0.60.0

overrides:
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  react: "catalog:"
  react-dom: "catalog:"
